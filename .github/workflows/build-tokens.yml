name: Build Tokens

on:
  push:
    branches: [main]
    # Anything that can change a released artifact or the version must be able
    # to trigger a tag. Watching only tokens.json meant the Package.swift-only
    # 1.1.0 release was never validated, regenerated or tagged here.
    paths:
      - 'tokens.json'
      - 'package.json'
      - 'Package.swift'
      - 'design.md'
      - 'scripts/**'
      - '.github/workflows/build-tokens.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Validate tokens
        run: node scripts/validate.js

      - name: Build platform files
        run: node scripts/build.js

      - name: Run contract tests
        run: node scripts/test.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/ dist/
          git diff --cached --quiet || git commit -m "chore: regenerate platform tokens from tokens.json"
          git push

      - name: Tag version if bumped
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('./tokens.json','utf8')).meta.version)")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged v${VERSION}"
          else
            echo "Tag v${VERSION} already exists, skipping"
          fi

      # A tag alone leaves GitHub's "Latest release" pointing at whatever was
      # last released by hand — v0.5.0 held that label for three releases.
      # Every tag gets a Release, with notes read from the changelog.
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping"
            exit 0
          fi
          node scripts/release-notes.js "${VERSION}" > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            --latest
          echo "Released v${VERSION}"
