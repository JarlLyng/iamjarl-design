name: Build Tokens

on:
  push:
    paths: ['tokens.json', '.github/workflows/build-tokens.yml']
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate tokens
        run: node scripts/validate.js

      - name: Build platform files
        run: node scripts/build.js

      - name: Run contract tests
        run: node scripts/test.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/ dist/
          git diff --cached --quiet || git commit -m "chore: regenerate platform tokens from tokens.json"
          git push

      - name: Tag version if bumped
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('./tokens.json','utf8')).meta.version)")
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged v${VERSION}"
          else
            echo "Tag v${VERSION} already exists, skipping"
          fi
