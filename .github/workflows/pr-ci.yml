name: PR CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tokens.json'
      - 'apps.json'
      - 'components/**'
      - 'tokens.schema.json'
      - 'scripts/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'fonts/**'
      # The docs page has a browser test of its own
      - 'index.html'
      - 'dist/**'
      - 'package.json'
      - 'Package.swift'
      # validate.js asserts the version in these two agrees with tokens.json
      - 'CHANGELOG.md'
      - 'design.md'
      # validate.js requires a row for the current version, and test.js checks
      # the README's pins and SRI block. A file a check reads must be able to
      # trigger it, or deleting the row is a green PR.
      - 'MIGRATION.md'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared engines floor, 24 is what .nvmrc recommends
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate tokens
        run: node scripts/validate.js

      - name: Build platform files
        run: node scripts/build.js

      - name: Verify generated files are in sync
        run: |
          if ! git diff --exit-code Sources/ Tests/ dist/; then
            echo "::error::Generated files are out of sync. Run 'node scripts/build.js' locally and commit the changes."
            exit 1
          fi

      - name: Run contract tests
        run: node scripts/test.js

      # The components' DOM, focus and keyboard behaviour, in the Chrome the
      # runner already ships. No npm dependency; CI=true makes a missing Chrome
      # a failure rather than a skip.
      - name: Run browser tests
        run: node scripts/test-browser.js

      - name: Verify npm pack contents
        run: npm pack --dry-run

  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Swift package
        run: swift build

      # macOS: the AppKit path of the palette, and tabular digits.
      - name: Test on macOS
        run: swift test

      # `swift build` only ever compiled for macOS, so the UIKit and watchOS
      # branches had never been built in CI. Build each platform the package
      # declares.
      - name: Build for iOS, watchOS and tvOS
        run: |
          for platform in iOS watchOS tvOS; do
            xcodebuild build -scheme IAMJARLDesignTokens -destination "generic/platform=$platform" -quiet
          done

      # iOS: the UIKit path of the palette, and Dynamic Type, which macOS does
      # not have — this is where text is measured growing.
      - name: Test on an iOS simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for runtime in sorted(d, reverse=True):
              if 'iOS' in runtime:
                  for dev in d[runtime]:
                      if dev['name'].startswith('iPhone'):
                          print(dev['udid']); sys.exit()
          sys.exit('no iPhone simulator available')")
          set -o pipefail
          xcodebuild test -scheme IAMJARLDesignTokens -destination "id=$SIM" 2>&1 | tee ios-test.log \
            | grep -E "Test Case .*(passed|failed|skipped)|Executed [0-9]+ tests"
          # A skipped test is green but checked nothing. On the runner's current
          # iOS, nothing has a reason to skip.
          if grep -q "Test Case .* skipped" ios-test.log; then
            echo "::error::An iOS test was skipped in CI, so it checked nothing."
            exit 1
          fi
