name: PR CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tokens.json'
      - 'tokens.schema.json'
      - 'scripts/**'
      - 'Sources/**'
      - 'dist/**'
      - 'package.json'
      - 'Package.swift'
      # validate.js asserts the version in these two agrees with tokens.json
      - 'CHANGELOG.md'
      - 'design.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared engines floor, 24 is what .nvmrc recommends
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate tokens
        run: node scripts/validate.js

      - name: Build platform files
        run: node scripts/build.js

      - name: Verify generated files are in sync
        run: |
          if ! git diff --exit-code Sources/ dist/; then
            echo "::error::Generated files are out of sync. Run 'node scripts/build.js' locally and commit the changes."
            exit 1
          fi

      - name: Run contract tests
        run: node scripts/test.js

      - name: Verify npm pack contents
        run: npm pack --dry-run

  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Swift package
        run: swift build
