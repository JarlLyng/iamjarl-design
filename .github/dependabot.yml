version: 2
updates:
  # Keep GitHub Actions updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
    # A week's wait keeps out most malicious versions, which are usually found
    # and pulled within days. Security updates are not delayed (#59).
    cooldown:
      default-days: 7
